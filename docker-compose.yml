# =============================================================================
# Docker Compose — Webkominfo Application Stack
#
# ⚠️  PERINGATAN KEAMANAN:
# Environment ini dirancang HANYA untuk LAB TESTING KEAMANAN LOKAL.
# JANGAN expose ke internet publik atau jaringan di luar localhost.
# Semua pengujian HARUS ditujukan ke aplikasi milik sendiri yang berjalan
# di environment ini. BUKAN untuk menyerang sistem pihak lain.
#
# Arsitektur:
#   Browser → Nginx (port 80/443) → Next.js (internal:3000)
#                                  → PostgreSQL (internal:5432)
#                                  → MinIO (internal:9000/9001)
#
# Port yang diexpose ke host: HANYA 80 (HTTP) dan 443 (HTTPS)
# Port internal (TIDAK accessible dari host):
#   - 3000 (Next.js)
#   - 5432 (PostgreSQL) 
#   - 9000 (MinIO API)
#   - 9001 (MinIO Console)
# =============================================================================

name: webkominfo-kp

services:
  # ---------------------------------------------------------------------------
  # NGINX — Reverse Proxy (satu-satunya entry point dari host)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: webkominfo-kp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      web:
        condition: service_started
    networks:
      - webkominfo-kp-net
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

  # ---------------------------------------------------------------------------
  # POSTGRESQL — Database (internal only, TIDAK expose port ke host)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: webkominfo-kp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-webkominfo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webkominfo-kp-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webkominfo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------------------
  # MINIO — S3-Compatible Object Storage (internal only)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: webkominfo-kp-minio
    # ⚠️ TIDAK ADA ports mapping — hanya accessible via internal network
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - webkominfo-kp-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------------------
  # WEB — Next.js Application (internal only, diakses via Nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webkominfo-kp-app
    # ⚠️ TIDAK ADA ports mapping — hanya accessible via Nginx reverse proxy
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # MinIO: container-to-container communication via service name
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=webkominfo
      # Public URL: client (browser) mengakses via Nginx proxy
      # Karena MinIO tidak di-expose ke host, asset perlu diakses via proxy
      # atau Anda bisa menambah location block di nginx untuk proxy ke MinIO
      - MINIO_PUBLIC_URL=http://localhost:9000/webkominfo
      # PostgreSQL: internal Docker network
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-webkominfo}?schema=public
    env_file:
      - .env.local
    volumes: []
    networks:
      - webkominfo-kp-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

# =============================================================================
# VOLUMES — Persistent data
# =============================================================================
volumes:
  minio_data:
  postgres_data:

# =============================================================================
# NETWORKS — Custom bridge network (isolasi dari default Docker network)
#
# ⚠️  Network ini HANYA untuk komunikasi antar container.
#     Tidak boleh dihubungkan ke jaringan eksternal/internet.
# =============================================================================
networks:
  webkominfo-kp-net:
    driver: bridge
    name: webkominfo-kp-net
    # Label untuk identifikasi dan dokumentasi
    labels:
      com.webkominfo.purpose: "security-testing-lab"
      com.webkominfo.warning: "LOCAL TESTING ONLY - Do not expose to public internet"

